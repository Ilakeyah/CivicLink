<!DOCTYPE html>
<html>
<head>
    <title>Offer a Service - CivicLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="dashboard-header">
    <div class="header-left">CivicLink</div>
    <div class="header-center">Offer a Service</div>
    <div class="header-right">
        <a href="user-dashboard.html" class="logout-btn">Back</a>
    </div>
</header>

<div class="form-container">
    <h2>Offer a Service</h2>

    <form class="donation-form" id="serviceForm" enctype="multipart/form-data">

        <label>Service Description</label>
        <textarea id="description" required></textarea>

        <label>Service Category</label>
        <select id="category" required onchange="toggleOtherService()">
            <option value="">Select Category</option>
            <option value="Education">Education</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Counselling">Counselling</option>
            <option value="Skill Training">Skill Training</option>
            <option value="Other">Other</option>
        </select>

        <input type="text" id="otherService"
               placeholder="Specify service category"
               style="display:none;">

        <label>Upload Your Photo (Mandatory)</label>
        <input type="file" id="image" accept="image/*" required>

        <div class="status-tag open">Status: OPEN</div>
        <button type="submit" class="submit-btn">Submit Service</button>
    </form>
</div>

<script>
function toggleOtherService() {
    const category = document.getElementById("category").value;
    const other = document.getElementById("otherService");
    other.style.display = category === "Other" ? "block" : "none";
}

document.getElementById("serviceForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    let category = document.getElementById("category").value;
    const other = document.getElementById("otherService").value.trim();
    const description = document.getElementById("description").value.trim();
    const image = document.getElementById("image").files[0];
    const userId = localStorage.getItem("user_id");

    if (category === "Other") category = `Other - ${other}`;

    const verify = await fetch("http://localhost:5000/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "SERVICE", category, description })
    }).then(r => r.json());

    if (!verify.verified) {
        alert("❌ " + verify.reason);
        return;
    }

    const formData = new FormData();
    formData.append("user_id", userId);
    formData.append("type", "SERVICE");
    formData.append("category", category);
    formData.append("description", description);
    formData.append("location", "Coimbatore");
    formData.append("image", image);

    await fetch("http://localhost:3000/api/contributions/add", {
        method: "POST",
        body: formData
    });

    alert("✅ Service submitted successfully!");
    window.location.href = "my-open-contributions.html";
});
</script>

</body>
</html>
